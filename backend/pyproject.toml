[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agricultural-advisory-control-room"
version = "1.0.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "agent-framework-core>=1.26,<2",
  "agent-framework-openai>=1.18,<2",
  "chromadb>=1.3,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "pymongo>=4.13,<5",
  "pypdf>=5,<7",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.2,<5",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.8,<1"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"app.data" = ["AgriAI.csv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.fastapi]
entrypoint = "app.main:app"
